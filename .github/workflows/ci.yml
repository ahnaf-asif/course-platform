name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: be

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.10'
        cache: true
        cache-dependency-path: be/go.sum

    - name: Install dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.6
        working-directory: be
        # Force installation via 'go install' to ensure it's built with Go 1.25.10
        # This avoids the "exit code 3" version mismatch error.
        install-mode: goinstall

    - name: Build
      run: go build -v ./...

    - name: Run Unit Tests
      run: make test

    - name: Run Integration Tests
      run: make test-integration
