apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-platform-api
  labels:
    app: course-platform-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-platform-api
  template:
    metadata:
      labels:
        app: course-platform-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: api
        image: course-platform-api:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        env:
        - name: ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: db-url
        - name: REDIS_URL
          value: "redis-service:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: jwt-secret
        - name: OTEL_COLLECTOR_ADDR
          value: "jaeger-collector:4317"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"] # Wait for load balancer to stop sending traffic
