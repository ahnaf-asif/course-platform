post:
  summary: Refresh access token
  tags:
    - Authentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/auth.yaml#/RefreshRequest'
  responses:
    '200':
      description: Token refreshed successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginResponse'
    '401':
      description: Invalid or expired refresh token
