/courses/{id}/tree:
  get:
    tags:
      - Curriculum
    summary: Get full course tree
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Course tree retrieved
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/curriculum.yaml#/CourseTreeResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Unauthorized'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/NotFound'

