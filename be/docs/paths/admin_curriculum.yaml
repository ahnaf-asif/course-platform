/admin/subjects:
  post:
    tags:
      - Admin Curriculum
    summary: Create a new subject
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/curriculum.yaml#/CreateSubjectRequest'
    responses:
      '201':
        description: Subject created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/curriculum.yaml#/SubjectResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/BadRequest'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Unauthorized'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Forbidden'

/admin/subjects/{id}:
  patch:
    tags:
      - Admin Curriculum
    summary: Update a subject
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/curriculum.yaml#/UpdateSubjectRequest'
    responses:
      '200':
        description: Subject updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/curriculum.yaml#/SubjectResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/BadRequest'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Unauthorized'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Forbidden'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/NotFound'
  delete:
    tags:
      - Admin Curriculum
    summary: Delete a subject
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Subject deleted
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Unauthorized'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Forbidden'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/NotFound'

