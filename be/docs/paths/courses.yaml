get:
  tags:
    - Course
  summary: List all published courses
  description: Returns public list of published courses.
  operationId: listPublishedCourses
  responses:
    '200':
      description: List of courses
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/course.yaml#/CourseResponse'
    '500':
      description: Internal server error
