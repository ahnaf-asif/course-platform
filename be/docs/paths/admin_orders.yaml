/admin/orders:
  get:
    tags:
      - Admin Commerce
    summary: List all orders with filters (Admin)
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, COMPLETED, REFUNDED]
      - name: payment_provider
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
    responses:
      '200':
        description: List of orders
        content:
          application/json:
            schema:
              $ref: '../components/schemas/commerce.yaml#/AdminOrderListResponse'

/admin/orders/summary:
  get:
    tags:
      - Admin Commerce
    summary: Get orders summary statistics (Admin)
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Order statistics summary
        content:
          application/json:
            schema:
              $ref: '../components/schemas/commerce.yaml#/AdminOrderSummaryResponse'

/admin/orders/{id}:
  get:
    tags:
      - Admin Commerce
    summary: Get order details by ID (Admin)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Order details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/commerce.yaml#/AdminOrderDetailResponse'

/admin/orders/{id}/status:
  patch:
    tags:
      - Admin Commerce
    summary: Update order status (Admin)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/commerce.yaml#/UpdateOrderStatusRequest'
    responses:
      '200':
        description: Updated order status
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  type: string
