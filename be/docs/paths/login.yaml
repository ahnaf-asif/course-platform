post:
  summary: Login user
  tags:
    - Authentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/auth.yaml#/LoginRequest'
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginResponse'
    '401':
      description: Invalid credentials
