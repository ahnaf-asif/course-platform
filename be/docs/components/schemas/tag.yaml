TagResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    created_at:
      type: string
      format: date-time
  required:
    - id
    - name
    - slug
    - created_at

CreateTagRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 50
    slug:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-z0-9-]+$'
  required:
    - name

UpdateTagRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 50
    slug:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-z0-9-]+$'
  minProperties: 1

AttachTagRequest:
  type: object
  properties:
    tag_id:
      type: string
      format: uuid
  required:
    - tag_id
