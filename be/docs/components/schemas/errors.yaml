ValidationError:
  type: object
  properties:
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string

BadRequest:
  type: object
  properties:
    message:
      type: string
  required:
    - message

Unauthorized:
  type: object
  properties:
    message:
      type: string
  required:
    - message

Forbidden:
  type: object
  properties:
    message:
      type: string
  required:
    - message

NotFound:
  type: object
  properties:
    message:
      type: string
  required:
    - message
