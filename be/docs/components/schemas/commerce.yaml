CheckoutRequest:
  type: object
  required:
    - node_id
  properties:
    node_id:
      type: string
      format: uuid
    coupon_code:
      type: string

CheckoutResponse:
  type: object
  required:
    - enrolled
  properties:
    enrolled:
      type: boolean
    checkout_url:
      type: string
    order_id:
      type: string
      format: uuid

AccessResponse:
  type: object
  required:
    - has_access
  properties:
    has_access:
      type: boolean

EnrolledCourseResponse:
  type: object
  required:
    - id
    - node_type
    - title
    - slug
    - description
    - is_published
    - created_at
    - enrolled_at
  properties:
    id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    node_type:
      type: string
    title:
      type: string
    slug:
      type: string
    description:
      type: string
    thumbnail_url:
      type: string
      nullable: true
    is_published:
      type: boolean
    price:
      type: string
    currency:
      type: string
    created_at:
      type: string
      format: date-time
    enrolled_at:
      type: string
      format: date-time

AdminOrderResponse:
  type: object
  required:
    - id
    - user_id
    - user_name
    - user_email
    - node_id
    - course_title
    - course_slug
    - amount_paid
    - currency
    - status
    - payment_provider
    - provider_reference
    - created_at
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    user_name:
      type: string
    user_email:
      type: string
      format: email
    node_id:
      type: string
      format: uuid
    course_title:
      type: string
    course_slug:
      type: string
    amount_paid:
      type: string
    currency:
      type: string
    status:
      type: string
      enum: [PENDING, COMPLETED, REFUNDED]
    payment_provider:
      type: string
    provider_reference:
      type: string
    coupon_id:
      type: string
      format: uuid
      nullable: true
    coupon_code:
      type: string
      nullable: true
    coupon_discount_type:
      type: string
      enum: [PERCENTAGE, FIXED]
      nullable: true
    coupon_discount_value:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time

AdminOrderListResponse:
  type: object
  required:
    - orders
    - total_count
    - page
    - limit
    - total_pages
  properties:
    orders:
      type: array
      items:
        $ref: '#/AdminOrderResponse'
    total_count:
      type: integer
    page:
      type: integer
    limit:
      type: integer
    total_pages:
      type: integer

AdminOrderSummaryResponse:
  type: object
  required:
    - total_orders
    - total_revenue
    - completed_orders
    - pending_orders
    - refunded_orders
  properties:
    total_orders:
      type: integer
    total_revenue:
      type: string
    completed_orders:
      type: integer
    pending_orders:
      type: integer
    refunded_orders:
      type: integer

AdminOrderDetailResponse:
  type: object
  required:
    - id
    - user_id
    - user_name
    - user_email
    - user_role
    - node_id
    - node_type
    - course_title
    - course_slug
    - course_thumbnail_url
    - amount_paid
    - currency
    - status
    - payment_provider
    - provider_reference
    - created_at
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    user_name:
      type: string
    user_email:
      type: string
    user_role:
      type: string
      enum: [ADMIN, USER]
    node_id:
      type: string
      format: uuid
    node_type:
      type: string
    course_title:
      type: string
    course_slug:
      type: string
    course_thumbnail_url:
      type: string
    amount_paid:
      type: string
    currency:
      type: string
    status:
      type: string
      enum: [PENDING, COMPLETED, REFUNDED]
    payment_provider:
      type: string
    provider_reference:
      type: string
    coupon_id:
      type: string
      format: uuid
      nullable: true
    coupon_code:
      type: string
      nullable: true
    coupon_discount_type:
      type: string
      enum: [PERCENTAGE, FIXED]
      nullable: true
    coupon_discount_value:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time

UpdateOrderStatusRequest:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [PENDING, COMPLETED, REFUNDED]

