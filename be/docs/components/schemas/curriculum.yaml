CourseTreeResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    node_type:
      type: string
    level:
      type: integer
    title:
      type: string
    sequence_order:
      type: integer
      nullable: true
    video_url:
      type: string
      format: uri
      nullable: true
    text_content:
      type: string
      nullable: true
    has_quizzes:
      type: boolean
  required:
    - id
    - node_type
    - level
    - title
    - has_quizzes

