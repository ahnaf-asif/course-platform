QuizResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    passing_score:
      type: integer
    created_at:
      type: string
      format: date-time
  required:
    - id
    - title
    - passing_score
    - created_at

CreateQuizRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    passing_score:
      type: integer
      minimum: 0
      maximum: 100
  required:
    - title
    - passing_score

UpdateQuizRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    passing_score:
      type: integer
      minimum: 0
      maximum: 100
  minProperties: 1

AnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    is_correct:
      type: boolean
  required:
    - content
    - is_correct

QuestionRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
    question_type:
      type: string
      enum: [SINGLE, MULTIPLE]
    sequence_order:
      type: integer
      minimum: 0
    explanation:
      type: string
      nullable: true
    answers:
      type: array
      items:
        $ref: '#/AnswerOption'
      minItems: 2
  required:
    - content
    - question_type
    - sequence_order
    - answers

BulkQuestionsRequest:
  type: object
  properties:
    questions:
      type: array
      items:
        $ref: '#/QuestionRequest'
  required:
    - questions

QuestionResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    quiz_id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    sequence_order:
      type: integer
    explanation:
      type: string
      nullable: true
    answers:
      type: array
      items:
        $ref: '#/AnswerOption'
  required:
    - id
    - quiz_id
    - content
    - question_type
    - sequence_order
    - answers

StudentAnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
  required:
    - id
    - content

StudentQuestionResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    quiz_id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    answers:
      type: array
      items:
        $ref: '#/StudentAnswerOption'
  required:
    - id
    - quiz_id
    - content
    - question_type
    - answers

SubmitAnswerItem:
  type: object
  properties:
    question_id:
      type: string
      format: uuid
    answer_id:
      type: string
      format: uuid
  required:
    - question_id

SubmitQuizRequest:
  type: object
  properties:
    answers:
      type: array
      items:
        $ref: '#/SubmitAnswerItem'
    time_spent_seconds:
      type: integer
  required:
    - answers

AttemptAnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    is_correct:
      type: boolean
  required:
    - id
    - content
    - is_correct

AttemptDetailQuestion:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    explanation:
      type: string
    is_correct:
      type: boolean
    user_answers:
      type: array
      items:
        type: string
        format: uuid
    answer_options:
      type: array
      items:
        $ref: '#/AttemptAnswerOption'
  required:
    - id
    - content
    - question_type
    - explanation
    - is_correct
    - user_answers
    - answer_options

SubmitQuizResponse:
  type: object
  properties:
    attempt_id:
      type: string
      format: uuid
    score:
      type: number
    is_passed:
      type: boolean
    passing_score:
      type: integer
    time_spent_seconds:
      type: integer
    total_questions:
      type: integer
    correct_count:
      type: integer
    wrong_count:
      type: integer
    unanswered_count:
      type: integer
    total_negative_marks:
      type: number
    is_first_attempt:
      type: boolean
    rank_position:
      type: integer
      nullable: true
    completed_at:
      type: string
      format: date-time
    questions:
      type: array
      items:
        $ref: '#/AttemptDetailQuestion'
  required:
    - attempt_id
    - score
    - is_passed
    - passing_score
    - time_spent_seconds
    - total_questions
    - correct_count
    - wrong_count
    - unanswered_count
    - total_negative_marks
    - is_first_attempt
    - completed_at
    - questions

StudentQuizAttemptSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    score:
      type: number
    is_passed:
      type: boolean
    time_spent_seconds:
      type: integer
    total_questions:
      type: integer
    correct_count:
      type: integer
    wrong_count:
      type: integer
    unanswered_count:
      type: integer
    total_negative_marks:
      type: number
    is_first_attempt:
      type: boolean
    completed_at:
      type: string
      format: date-time
  required:
    - id
    - score
    - is_passed
    - time_spent_seconds
    - total_questions
    - correct_count
    - wrong_count
    - unanswered_count
    - total_negative_marks
    - is_first_attempt
    - completed_at

LeaderboardEntryResponse:
  type: object
  properties:
    rank_position:
      type: integer
    attempt_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    user_name:
      type: string
    avatar_url:
      type: string
      nullable: true
    score:
      type: number
    correct_count:
      type: integer
    wrong_count:
      type: integer
    unanswered_count:
      type: integer
    total_negative_marks:
      type: number
    time_spent_seconds:
      type: integer
    completed_at:
      type: string
      format: date-time
    is_current_user:
      type: boolean
  required:
    - rank_position
    - attempt_id
    - user_id
    - user_name
    - score
    - correct_count
    - wrong_count
    - unanswered_count
    - total_negative_marks
    - time_spent_seconds
    - completed_at
    - is_current_user

LeaderboardResponse:
  type: object
  properties:
    quiz_id:
      type: string
      format: uuid
    quiz_title:
      type: string
    total_participants:
      type: integer
    my_rank:
      $ref: '#/LeaderboardEntryResponse'
      nullable: true
    entries:
      type: array
      items:
        $ref: '#/LeaderboardEntryResponse'
  required:
    - quiz_id
    - quiz_title
    - total_participants
    - entries
