QuizResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    passing_score:
      type: integer
    created_at:
      type: string
      format: date-time
  required:
    - id
    - title
    - passing_score
    - created_at

CreateQuizRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    passing_score:
      type: integer
      minimum: 0
      maximum: 100
  required:
    - title
    - passing_score

UpdateQuizRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    passing_score:
      type: integer
      minimum: 0
      maximum: 100
  minProperties: 1

AnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    is_correct:
      type: boolean
  required:
    - content
    - is_correct

QuestionRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
    question_type:
      type: string
      enum: [SINGLE, MULTIPLE]
    sequence_order:
      type: integer
      minimum: 0
    explanation:
      type: string
      nullable: true
    answers:
      type: array
      items:
        $ref: '#/AnswerOption'
      minItems: 2
  required:
    - content
    - question_type
    - sequence_order
    - answers

BulkQuestionsRequest:
  type: object
  properties:
    questions:
      type: array
      items:
        $ref: '#/QuestionRequest'
  required:
    - questions

QuestionResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    quiz_id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    sequence_order:
      type: integer
    explanation:
      type: string
      nullable: true
    answers:
      type: array
      items:
        $ref: '#/AnswerOption'
  required:
    - id
    - quiz_id
    - content
    - question_type
    - sequence_order
    - answers

StudentAnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
  required:
    - id
    - content

StudentQuestionResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    quiz_id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    answers:
      type: array
      items:
        $ref: '#/StudentAnswerOption'
  required:
    - id
    - quiz_id
    - content
    - question_type
    - answers

SubmitAnswerItem:
  type: object
  properties:
    question_id:
      type: string
      format: uuid
    answer_id:
      type: string
      format: uuid
  required:
    - question_id

SubmitQuizRequest:
  type: object
  properties:
    answers:
      type: array
      items:
        $ref: '#/SubmitAnswerItem'
  required:
    - answers

AttemptAnswerOption:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    is_correct:
      type: boolean
  required:
    - id
    - content
    - is_correct

AttemptDetailQuestion:
  type: object
  properties:
    id:
      type: string
      format: uuid
    content:
      type: string
    question_type:
      type: string
    explanation:
      type: string
    is_correct:
      type: boolean
    user_answers:
      type: array
      items:
        type: string
        format: uuid
    answer_options:
      type: array
      items:
        $ref: '#/AttemptAnswerOption'
  required:
    - id
    - content
    - question_type
    - explanation
    - is_correct
    - user_answers
    - answer_options

SubmitQuizResponse:
  type: object
  properties:
    attempt_id:
      type: string
      format: uuid
    score:
      type: integer
    is_passed:
      type: boolean
    passing_score:
      type: integer
    completed_at:
      type: string
      format: date-time
    questions:
      type: array
      items:
        $ref: '#/AttemptDetailQuestion'
  required:
    - attempt_id
    - score
    - is_passed
    - passing_score
    - completed_at
    - questions

StudentQuizAttemptSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    score:
      type: integer
    is_passed:
      type: boolean
    completed_at:
      type: string
      format: date-time
  required:
    - id
    - score
    - is_passed
    - completed_at
