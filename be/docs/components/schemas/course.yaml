CourseResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    node_type:
      type: string
      enum: [COURSE, SUBJECT, CHAPTER, LESSON]
    title:
      type: string
    slug:
      type: string
    description:
      type: string
    thumbnail_url:
      type: string
      nullable: true
    is_published:
      type: boolean
    price:
      type: string
      nullable: true
    currency:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
  required:
    - id
    - node_type
    - title
    - slug
    - description
    - is_published
    - created_at

CreateCourseRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    description:
      type: string
      minLength: 10
    thumbnail_url:
      type: string
      format: uri
    is_published:
      type: boolean
    price:
      type: string
    currency:
      type: string
  required:
    - title
    - description

UpdateCourseRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 255
    slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    description:
      type: string
      minLength: 10
    thumbnail_url:
      type: string
      format: uri
    is_published:
      type: boolean
    price:
      type: string
    currency:
      type: string
  minProperties: 1
