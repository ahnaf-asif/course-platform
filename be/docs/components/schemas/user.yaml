UserProfileResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    role:
      type: string
      enum: [ADMIN, USER]
    full_name:
      type: string
    avatar_url:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - email
    - role
    - full_name
    - created_at
    - updated_at

UpdateUserProfileRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    full_name:
      type: string
      maxLength: 100
    avatar_url:
      type: string
      format: uri
    bio:
      type: string
      maxLength: 500
  minProperties: 1

UpdatePasswordRequest:
  type: object
  properties:
    old_password:
      type: string
    new_password:
      type: string
      minLength: 8
      maxLength: 72
  required:
    - old_password
    - new_password
