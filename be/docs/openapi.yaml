openapi: 3.0.3
info:
  title: Course Platform API
  description: |
    Backend API for the Course Platform project.
    
    ### Security
    - **Authentication:** JWT-based access tokens with refresh tokens.
    - **CORS:** Supported. Allowed origins are configurable.
    - **Rate Limiting:** Applied to sensitive endpoints (Login, Register).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server v1
paths:
  /auth/register:
    $ref: './paths/register.yaml'
  /auth/login:
    $ref: './paths/login.yaml'
  /auth/refresh:
    $ref: './paths/refresh.yaml'
  /auth/logout:
    $ref: './paths/logout.yaml'
  /users/me:
    $ref: './paths/me.yaml'
  /users/me/password:
    $ref: './paths/password.yaml'
  /admin/courses:
    $ref: './paths/admin_courses.yaml#/~1admin~1courses'
  /admin/courses/{id}:
    $ref: './paths/admin_courses.yaml#/~1admin~1courses~1{id}'
  /admin/subjects:
    $ref: './paths/admin_curriculum.yaml#/~1admin~1subjects'
  /admin/subjects/{id}:
