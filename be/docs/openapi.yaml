openapi: 3.0.3
info:
  title: Course Platform API
  description: |
    Backend API for the Course Platform project.
    
    ### Security
    - **Authentication:** JWT-based access tokens with refresh tokens.
    - **CORS:** Supported. Allowed origins are configurable.
    - **Rate Limiting:** Applied to sensitive endpoints (Login, Register).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server v1
paths:
  /auth/register:
    $ref: './paths/register.yaml'
  /auth/login:
    $ref: './paths/login.yaml'
  /auth/refresh:
    $ref: './paths/refresh.yaml'
  /auth/logout:
    $ref: './paths/logout.yaml'
  /users/me:
    $ref: './paths/me.yaml'
  /users/me/password:
    $ref: './paths/password.yaml'
  /admin/courses:
    $ref: './paths/admin_courses.yaml#/admin/courses'
  /admin/courses/{id}:
    $ref: './paths/admin_courses.yaml#/admin/courses/{id}'
  /admin/subjects:
    $ref: './paths/admin_curriculum.yaml#/admin/subjects'
  /admin/subjects/{id}:
    $ref: './paths/admin_curriculum.yaml#/admin/subjects/{id}'
  /admin/chapters:
    $ref: './paths/admin_curriculum.yaml#/admin/chapters'
  /admin/chapters/{id}:
    $ref: './paths/admin_curriculum.yaml#/admin/chapters/{id}'
  /admin/lessons:
    $ref: './paths/admin_curriculum.yaml#/admin/lessons'
  /admin/lessons/{id}:
    $ref: './paths/admin_curriculum.yaml#/admin/lessons/{id}'
  /admin/quizzes:
    $ref: './paths/admin_assessment.yaml#/admin/quizzes'
  /admin/quizzes/{id}:
    $ref: './paths/admin_assessment.yaml#/admin/quizzes/{id}'
  /admin/quizzes/{id}/questions:
    $ref: './paths/admin_assessment.yaml#/admin/quizzes/{id}/questions'
  /courses/{id}/tree:
    $ref: './paths/admin_curriculum.yaml#/courses/{id}/tree'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      $ref: './components/schemas/auth.yaml#/RegisterRequest'
    LoginRequest:
      $ref: './components/schemas/auth.yaml#/LoginRequest'
    RefreshRequest:
      $ref: './components/schemas/auth.yaml#/RefreshRequest'
    LogoutRequest:
      $ref: './components/schemas/auth.yaml#/LogoutRequest'
    UserResponse:
      $ref: './components/schemas/auth.yaml#/UserResponse'
    UserProfileResponse:
      $ref: './components/schemas/user.yaml#/UserProfileResponse'
    UpdateUserProfileRequest:
      $ref: './components/schemas/user.yaml#/UpdateUserProfileRequest'
    UpdatePasswordRequest:
      $ref: './components/schemas/user.yaml#/UpdatePasswordRequest'
    LoginResponse:
      $ref: './components/schemas/auth.yaml#/LoginResponse'
    ValidationError:
      $ref: './components/schemas/errors.yaml#/ValidationError'
    CourseResponse:
      $ref: './components/schemas/course.yaml#/CourseResponse'
    CreateCourseRequest:
      $ref: './components/schemas/course.yaml#/CreateCourseRequest'
    UpdateCourseRequest:
      $ref: './components/schemas/course.yaml#/UpdateCourseRequest'
    SubjectResponse:
      $ref: './components/schemas/curriculum.yaml#/SubjectResponse'
    CreateSubjectRequest:
      $ref: './components/schemas/curriculum.yaml#/CreateSubjectRequest'
    UpdateSubjectRequest:
      $ref: './components/schemas/curriculum.yaml#/UpdateSubjectRequest'
    ChapterResponse:
      $ref: './components/schemas/curriculum.yaml#/ChapterResponse'
    CreateChapterRequest:
      $ref: './components/schemas/curriculum.yaml#/CreateChapterRequest'
    UpdateChapterRequest:
      $ref: './components/schemas/curriculum.yaml#/UpdateChapterRequest'
    LessonResponse:
      $ref: './components/schemas/curriculum.yaml#/LessonResponse'
    CreateLessonRequest:
      $ref: './components/schemas/curriculum.yaml#/CreateLessonRequest'
    UpdateLessonRequest:
      $ref: './components/schemas/curriculum.yaml#/UpdateLessonRequest'
    QuizResponse:
      $ref: './components/schemas/assessment.yaml#/QuizResponse'
    CreateQuizRequest:
      $ref: './components/schemas/assessment.yaml#/CreateQuizRequest'
    UpdateQuizRequest:
      $ref: './components/schemas/assessment.yaml#/UpdateQuizRequest'
    QuestionResponse:
      $ref: './components/schemas/assessment.yaml#/QuestionResponse'
    BulkQuestionsRequest:
      $ref: './components/schemas/assessment.yaml#/BulkQuestionsRequest'
    AttachQuizRequest:
      $ref: './components/schemas/node_quiz.yaml#/AttachQuizRequest'
    CourseTreeResponse:
      $ref: './components/schemas/curriculum.yaml#/CourseTreeResponse'
